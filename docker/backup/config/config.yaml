repositories:
  - path: ${BORG_REPO}
    label: homelab

source_directories:
  - /mnt/source/photos
  - /mnt/source/vaultwarden
  - /mnt/source/linkding
  - /mnt/source/syncthing
  - /mnt/source/technitium-config
  - /mnt/source/vaultls

archive_name_format: "homelab-{now:%Y-%m-%d-%H%M%S}"

keep_daily: 7
keep_weekly: 4
keep_monthly: 12

checks:
  - name: repository
    frequency: 1 month
  - name: archives
    frequency: 1 month
check_last: 3

postgresql_databases:
  - name: ${DB_DATABASE_NAME}
    hostname: database
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    format: custom

sqlite_databases:
  - name: vaultwarden
    path: /mnt/source/vaultwarden/db.sqlite3
  - name: linkding
    path: /mnt/source/linkding/db.sqlite3
