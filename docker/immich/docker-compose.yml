volumes:
  model-cache:

networks:
  immich:
    name: immich
  proxy:
    external: true

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.2
    container_name: immich_server
    restart: always
    env_file:
      - secrets.envc.env
    volumes:
      - /srv/photos/:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false
    networks:
      - immich
      - proxy
    labels:
      - dockdns.name=photos.tmak2002.de
      - dockdns.proxied=false

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2
    container_name: immich_machine_learning
    restart: always
    env_file:
      - secrets.envc.env
    volumes:
      - model-cache:/cache
    healthcheck:
      disable: false
    networks:
      - immich

  redis:
    image: docker.io/valkey/valkey:9@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056
    container_name: immich_redis
    restart: always
    healthcheck:
      test: redis-cli ping || exit 1
    networks:
      - immich

  database:
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    container_name: immich_postgres
    restart: always
    environment:
      POSTGRES_INITDB_ARGS: '--data-checksums'
    env_file:
      - secrets.envc.env
    volumes:
      - /srv/immich_db/:/var/lib/postgresql/data
    healthcheck:
      disable: false
    shm_size: 128mb
    networks:
      - immich
