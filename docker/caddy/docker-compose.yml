volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    name: proxy

services:
  vaultls:
    image: ghcr.io/7ritn/vaultls:v1.4.1
    container_name: vaultls
    restart: unless-stopped
    env_file:
      - secrets.enc.env
    volumes:
      - /srv/vaultls/:/app/data/
    networks:
      - proxy
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:2.11.9-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - secrets.enc.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /srv/vaultls/:/vaultls/
      - caddy_data:/data
      - caddy_config:/config
    cap_add:
      - NET_ADMIN
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - proxy
