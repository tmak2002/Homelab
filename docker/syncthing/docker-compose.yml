networks:
  proxy:
    external: true

services:
  syncthing:
    container_name: syncthing
    image: syncthing/syncthing:2.1.5
    restart: unless-stopped
    ports:
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    volumes:
      - /srv/syncthing:/var/syncthing
    environment:
      TZ: Europe/Berlin
    networks:
      - proxy
    labels:
      - dockdns.name=syncthing.tmak2002.de
      - dockdns.proxied=false
    post_start:
      - command: chown -R 1000:1000 /var/syncthing/
        user: root
