networks:
  proxy:
    external: true

services:
  linkding:
    image: sissbruecker/linkding:1.47.0
    container_name: linkding
    restart: unless-stopped
    volumes:
      - /srv/linkding:/etc/linkding/data"
    networks:
      - proxy
    labels:
      - dockdns.name=links.tmak2002.de
      - dockdns.proxied=false
